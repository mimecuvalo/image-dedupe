[package]
name = "image-dedupe"
version = "0.1.0"
description = "Desktop app to find and remove duplicate images"
authors = ["Mime Čuvalo"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.88"
default-run = "image-dedupe"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-shell = "2.3.5"
image = "0.25.6"
image_hasher = "3.0.0"
rayon = "1.10.0"
walkdir = "2.5.0"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v4"] }
image-compare = "0.5.0"
trash = "5.2.5"

[[bin]]
name = "bench_params"
path = "src/bin/bench_params.rs"

# Tuned for maximum runtime speed; binary size and compile time are not a concern.
[profile.release]
opt-level = 3
lto = "fat"          # whole-program inlining across crates (image/image_hasher/rayon)
codegen-units = 1    # one unit => best optimization, no parallel codegen
panic = "unwind"     # keep unwind: image decoding of a corrupt file panics, and
                     # rayon can catch it instead of aborting the whole app
debug = 1            # line tables only; zero runtime cost, makes Instruments useful
incremental = false
rpath = false

# Apply the same to every dependency, including build-time-heavy image crates.
[profile.release.package."*"]
opt-level = 3
codegen-units = 1

# `cargo bench` / bench_params inherit release settings above.
[profile.bench]
inherits = "release"

# Dev builds: keep our own crate fast to compile, but optimize deps so that
# decoding/hashing in a debug run isn't unusably slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
